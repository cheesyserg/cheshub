<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f9fdd'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='19' font-weight='700' text-anchor='middle' fill='%230d1114'%3EC%3C/text%3E%3C/svg%3E">
  <title>ChesHub | Peripheral Hub</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-blob blob-a"></span>
    <span class="ambient-blob blob-b"></span>
    <span class="ambient-blob blob-c"></span>
  </div>
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

  <div class="hub-container">
    <header class="hub-header">
      <div class="hub-brand">
        <span class="brand-mark">C</span>
        <div>
          <div class="brand-name">ChesHub</div>
          <div class="subtitle">Unified multi-device hardware configurator</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" id="btn-scan-vendor" type="button">Scan All Vendor HID</button>
        <button class="btn-primary" id="btn-scan" type="button">Pair / Detect Hardware</button>
      </div>
    </header>

    <div class="hub-intro">
      <div class="page-title">Devices</div>
      <p class="hint-line">Chrome or Edge only. Close the vendor utility before pairing —
        it holds the HID handle. A device can be opened without pairing; its studio asks
        to connect.</p>
    </div>

    <div class="devices-grid" id="devices-grid"></div>
    <pre class="scan-result" id="scan-result" hidden></pre>
  </div>

  <div id="toast-container"></div>

  <script src="assets/js/devices.js"></script>
  <script src="assets/js/theme.js"></script>

  <script src="assets/js/hub.js"></script>
</body>
</html>
