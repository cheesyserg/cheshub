<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChesHub | Peripheral Hub</title>
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>

  <div class="hub-container">
    <header class="hub-header">
      <div class="brand font-impact">CHES<span>HUB</span></div>
      <p class="subtitle">Unified Multi-Device Hardware Configurator</p>
    </header>

    <div class="action-bar">
      <button class="btn-primary font-impact" id="btn-scan" type="button">+ PAIR / DETECT HARDWARE</button>
      <button class="btn-ghost font-impact" id="btn-scan-vendor" type="button">SCAN ALL VENDOR HID</button>
      <p class="hint-line">
        Chrome or Edge only. Close the vendor utility first — it holds the HID handle.
        If nothing is listed, scan all vendor collections and report what comes back.
      </p>
      <pre class="scan-result" id="scan-result" hidden></pre>
    </div>

    <div class="devices-grid" id="devices-grid">
      <!-- Deduplicated active devices render here -->
    </div>
  </div>

  <script>
    const REGISTRY = [
      {
        id: "ajazz-aj139",
        name: "AJAZZ AJ139 V2 MC",
        type: "WebHID Gaming Mouse",
        path: "devices/ajazz-aj139/index.html",
        filters: [
          { vendorId: 0xA8A4, productId: 0x2255, usagePage: 0xFF01, usage: 0x10 },
          { vendorId: 0xA8A5, productId: 0x2255, usagePage: 0xFF01, usage: 0x10 }
        ]
      },
      {
        id: "tecknet-tk-gm012",
        name: "TECKNET TK-GM012",
        type: "Wireless Gaming Mouse",
        path: "devices/tecknet-tk-gm012/index.html",
        // Vendor id only: a filter that pins the usage page shows an empty
        // picker on units that describe the vendor collection differently.
        // The studio validates the collection after pairing instead.
        filters: [
          { vendorId: 0x248A },
          { vendorId: 0x249A }
        ]
      },
      {
        id: "tozo-ht3",
        name: "TOZO HT3 Headset",
        type: "Bluetooth Audio & Hybrid ANC",
        path: "devices/tozo-ht3/index.html",
        filters: [
          { namePrefix: "TOZO HT3" },
          { namePrefix: "TOZO" }
        ]
      }
    ];

    // A registry filter may specify any subset of vendorId / productId /
    // usagePage / usage. Anything unspecified is a wildcard.
    function registryMatch(device) {
      return REGISTRY.find(r => (r.filters || []).some(f => {
        if (f.namePrefix !== undefined) return false;
        if (f.vendorId !== undefined && f.vendorId !== device.vendorId) return false;
        if (f.productId !== undefined && f.productId !== device.productId) return false;
        if (f.usagePage === undefined) return true;
        return (device.collections || []).some(c =>
          c.usagePage === f.usagePage && (f.usage === undefined || c.usage === f.usage));
      }));
    }

    async function checkPairedDevices() {
      const grid = document.getElementById("devices-grid");
      grid.innerHTML = "";
      const detectedDeviceIds = new Set();

      // Check HID devices
      if (navigator.hid) {
        const paired = await navigator.hid.getDevices();
        paired.forEach(dev => {
          const match = registryMatch(dev);

          if (match && !detectedDeviceIds.has(match.id)) {
            detectedDeviceIds.add(match.id);
            grid.innerHTML += `
              <div class="device-card active" onclick="location.href='${match.path}'">
                <div class="card-status">ONLINE (HID)</div>
                <div class="card-name font-impact">${match.name}</div>
                <div class="card-desc">${match.type}</div>
                <button class="btn-primary font-impact">OPEN STUDIO</button>
              </div>
            `;
          }
        });
      }

      // Check Serial devices (for TOZO)
      if (navigator.serial) {
        try {
          const ports = await navigator.serial.getPorts();
          if (ports.length > 0 && !detectedDeviceIds.has("tozo-ht3")) {
            detectedDeviceIds.add("tozo-ht3");
            grid.innerHTML += `
              <div class="device-card active" onclick="location.href='devices/tozo-ht3/index.html'">
                <div class="card-status">ONLINE (SERIAL)</div>
                <div class="card-name font-impact">TOZO HT3 Headset</div>
                <div class="card-desc">Bluetooth Audio & Hybrid ANC</div>
                <button class="btn-primary font-impact">OPEN STUDIO</button>
              </div>
            `;
          }
        } catch (err) {
          console.warn("Could not get serial ports:", err);
        }
      }

      // Show empty state if no devices detected
      if (detectedDeviceIds.size === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="font-impact" style="font-size: 16px; color: #8b978f;">NO DEVICES CURRENTLY ACTIVE</div>
            <div style="font-size: 12px; color: #535e6d; margin-top: 6px;">Click the button above to pair your peripheral.</div>
          </div>
        `;
      }
    }

    document.getElementById("btn-scan").addEventListener("click", async () => {
      // Show protocol selection popup
      const choice = await showProtocolSelection();
      
      if (choice === "hid") {
        await pairViaHID();
      } else if (choice === "serial") {
        await pairViaSerial();
      }
    });

    // Fallback for devices the registry filters do not match: list every
    // vendor-defined HID collection and report what was picked.
    document.getElementById("btn-scan-vendor").addEventListener("click", async () => {
      if (!navigator.hid) return alert("WebHID is not available — use Chrome or Edge");
      const filters = [];
      for (let page = 0xFF00; page <= 0xFFFF; page++) filters.push({ usagePage: page });
      try {
        const devs = await navigator.hid.requestDevice({ filters });
        if (!devs.length) return;
        const dev = devs[0];
        const match = registryMatch(dev);
        if (match) {
          await checkPairedDevices();
          location.href = match.path;
          return;
        }
        const pages = (dev.collections || [])
          .map(c => `  usagePage 0x${c.usagePage.toString(16).toUpperCase()} / usage 0x${c.usage.toString(16).toUpperCase()}`);
        const out = document.getElementById("scan-result");
        out.hidden = false;
        out.textContent = [
          "Unregistered device — please report this:",
          `product    ${dev.productName || "(unnamed)"}`,
          `vendorId   0x${dev.vendorId.toString(16).toUpperCase()}`,
          `productId  0x${dev.productId.toString(16).toUpperCase()}`,
          "collections:",
          ...pages
        ].join("\n");
      } catch (err) {
        alert("Scan cancelled");
      }
    });

    async function showProtocolSelection() {
      return new Promise((resolve) => {
        // Create popup overlay
        const overlay = document.createElement("div");
        overlay.style.position = "fixed";
        overlay.style.top = "0";
        overlay.style.left = "0";
        overlay.style.width = "100%";
        overlay.style.height = "100%";
        overlay.style.background = "rgba(0,0,0,0.5)";
        overlay.style.display = "flex";
        overlay.style.alignItems = "center";
        overlay.style.justifyContent = "center";
        overlay.style.zIndex = "1000";
        
        // Create popup content
        const popup = document.createElement("div");
        popup.style.background = "var(--riot-panel)";
        popup.style.border = "1px solid var(--riot-border)";
        popup.style.borderRadius = "6px";
        popup.style.padding = "24px";
        popup.style.width = "300px";
        popup.style.textAlign = "center";
        
        popup.innerHTML = `
          <h3 style="color: var(--riot-white); margin-bottom: 16px;">Select Connection Type</h3>
          <div style="margin-bottom: 12px;">
            <button id="btn-hid" class="btn-primary font-impact" style="width: 100%; margin-bottom: 8px;">WebHID</button>
          </div>
          <div>
            <button id="btn-serial" class="btn-primary font-impact" style="width: 100%;">Serial (RFCOMM)</button>
          </div>
        `;
        
        overlay.appendChild(popup);
        document.body.appendChild(overlay);
        
        // Handle button clicks
        const cleanup = () => {
          document.removeEventListener("keydown", onKeyDown);
        };
        
        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            overlay.remove();
            cleanup();
            resolve(null);
          }
        };
        
        document.getElementById("btn-hid").onclick = () => {
          cleanup();
          overlay.remove();
          resolve("hid");
        };
        
        document.getElementById("btn-serial").onclick = () => {
          cleanup();
          overlay.remove();
          resolve("serial");
        };
        
        document.addEventListener("keydown", onKeyDown);
      });
    }

    async function pairViaHID() {
      try {
        // Build HID filters from registry (only valid HID properties)
        const allFilters = [];
        REGISTRY.forEach(r => {
          if (r.filters) {
            r.filters.forEach(f => {
              const filterObj = {};
              if (f.vendorId !== undefined) filterObj.vendorId = f.vendorId;
              if (f.productId !== undefined) filterObj.productId = f.productId;
              if (f.usagePage !== undefined) filterObj.usagePage = f.usagePage;
              if (f.usage !== undefined) filterObj.usage = f.usage;
              if (Object.keys(filterObj).length > 0) {
                allFilters.push(filterObj);
              }
            });
          }
        });

        const devs = await navigator.hid.requestDevice({ filters: allFilters });
        if (devs && devs.length > 0) {
          if (!devs[0].opened) await devs[0].open();
          await checkPairedDevices();
        }
      } catch (e) {
        console.warn("HID pairing failed", e);
        alert("HID pairing failed or was cancelled");
      }
    }

    async function pairViaSerial() {
      if (!navigator.serial) {
        alert("Serial API not available in this browser");
        return;
      }
      
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        await checkPairedDevices();
      } catch (err) {
        console.warn("Serial pairing failed", err);
        alert("Serial pairing failed or was cancelled");
      }
    }

    window.addEventListener("DOMContentLoaded", checkPairedDevices);
    if (navigator.hid) {
      navigator.hid.onconnect = checkPairedDevices;
      navigator.hid.ondisconnect = checkPairedDevices;
    }
    // Also check for serial device changes
    if (navigator.serial) {
      navigator.serial.onconnect = checkPairedDevices;
      navigator.serial.ondisconnect = checkPairedDevices;
    }
  </script>
</body>
</html>
