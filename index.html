<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f9fdd'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='19' font-weight='700' text-anchor='middle' fill='%230d1114'%3EC%3C/text%3E%3C/svg%3E">
  <title>ChesHub | Peripheral Hub</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/hub.css">
  <script src="assets/js/theme.js"></script>
</head>
<body>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-blob blob-a"></span>
    <span class="ambient-blob blob-b"></span>
    <span class="ambient-blob blob-c"></span>
  </div>
  <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

  <div class="hub-container">
    <header class="hub-header">
      <div class="hub-brand">
        <span class="brand-mark">C</span>
        <div>
          <div class="brand-name">ChesHub</div>
          <div class="subtitle">Unified multi-device hardware configurator</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-open-appearance type="button" title="Appearance" aria-label="Appearance">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M12 21a3 3 0 010-6 3 3 0 003-3"/></svg>
        </button>
        <button class="btn-ghost" id="btn-scan-vendor" type="button">Scan Vendor HID</button>
        <button class="btn-primary" id="btn-scan" type="button">Pair Device</button>
      </div>
    </header>

    <div class="devices-grid" id="devices-grid">
      <div class="hub-loading">Checking paired devices…</div>
    </div>
    <div class="hub-more" id="hub-more"></div>
    <pre class="scan-result" id="scan-result" hidden></pre>
  </div>

  <div id="toast-container"></div>

  <script src="assets/js/devices.js"></script>

  <script src="assets/js/hub.js"></script>
</body>
</html>
